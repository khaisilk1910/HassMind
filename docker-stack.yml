services:
  hassmind:
    build: .
    image: hassmind-v1:latest
    container_name: hassmind-v1
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    network_mode: host
    user: "10001:10001"
    env_file: [.env]
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}
      USER_SKILLS_DIR: /data/skills
      ALLOW_SCRIPT_ENTITIES: ${ALLOW_SCRIPT_ENTITIES:-script.fan_light_pn_kn_fan_1,script.fan_light_pn_kn_fan_2,script.fan_light_pn_kn_fan_3,script.fan_light_pn_kn_fan_4,script.fan_light_pn_kn_fan_5,script.fan_light_pn_kn_fan_6}
      HA_TOKEN_FILE: /run/secrets/ha_token
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      API_TOKEN_FILE: /run/secrets/hassmind_api_token
      ADMIN_BOOTSTRAP_PASSWORD_FILE: /run/secrets/admin_password
      ADMIN_RECOVERY_KEY_FILE: /run/secrets/admin_recovery_key
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    secrets:
      - ha_token
      - openai_api_key
      - hassmind_api_token
      - admin_password
      - admin_recovery_key
      - telegram_bot_token
    volumes:
      - ./data:/data:rw
      - ./knowledge:/knowledge:ro
      - ./config:/app/config:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  ha_token:
    file: ./secrets/ha_token.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  hassmind_api_token:
    file: ./secrets/hassmind_api_token.txt
  admin_password:
    file: ./secrets/admin_password.txt
  admin_recovery_key:
    file: ./secrets/admin_recovery_key.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
